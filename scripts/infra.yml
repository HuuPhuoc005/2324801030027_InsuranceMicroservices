services:
  eureka:
    build: ../eureka-server
    container_name: eureka-server
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  postgres:
    build: ../postgres
    container_name: postgres
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    environment:
      POSTGRES_PASSWORD: lab_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.2
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      timeout: 10s
      retries: 18
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbit
    ports: ["15672:15672", "5672:5672"]
    environment:
      RABBITMQ_DEFAULT_USER: lab_user
      RABBITMQ_DEFAULT_PASS: lab_pass
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
volumes:
  postgres-data:
